<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% seo %}
  <link rel="icon" href="/pipsmath_logo.png" />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .page-wrap { padding-top: 64px; min-height: 100vh; }
    .article-wrap { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
    .article-meta { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; color:var(--slate-400); font-size:.85rem; margin-bottom:1rem; }
    .article-cat { color:var(--cyan-400); background:rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.3); padding:3px 10px; border-radius:999px; font-weight:700; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
    .article-wrap h1 { font-size:clamp(1.8rem,4.5vw,2.6rem); font-weight:800; line-height:1.2; margin-bottom:1.5rem; }
    .article-body { color:var(--slate-300); line-height:1.85; font-size:1.02rem; }
    .article-body h2 { color:var(--white); font-size:1.4rem; margin:2.2rem 0 .8rem; }
    .article-body h3 { color:var(--white); font-size:1.15rem; margin:1.8rem 0 .6rem; }
    .article-body p, .article-body ul, .article-body ol { margin-bottom:1.1rem; }
    .article-body ul, .article-body ol { padding-left:1.4rem; }
    .article-body li { margin-bottom:.4rem; }
    .article-body a { color:var(--cyan-400); }
    .article-body strong { color:var(--white); }
    .article-body code { font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--bg-800); padding:1px 6px; border-radius:5px; font-size:.9em; color:#a5f3fc; }
    .article-body img { max-width:100%; border-radius:10px; }
    .article-cta { margin-top:3rem; padding:2rem; text-align:center; background:linear-gradient(135deg,var(--bg-800),rgba(34,211,238,.05)); border:1px solid rgba(34,211,238,.3); border-radius:16px; }
    .article-cta h3 { font-size:1.3rem; margin-bottom:.5rem; }
    .article-cta p { color:var(--slate-400); margin-bottom:1.25rem; }
    .blog-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1.5rem; }
    .blog-card { display:block; text-decoration:none; color:inherit; background:var(--bg-800); border:1px solid rgba(99,102,241,.2); border-radius:14px; padding:1.5rem; transition:transform .2s,border-color .2s; }
    .blog-card:hover { transform:translateY(-3px); border-color:rgba(34,211,238,.5); }
    .blog-card h2 { font-size:1.15rem; margin:.7rem 0 .5rem; color:var(--white); line-height:1.35; }
    .blog-card p { color:var(--slate-400); font-size:.9rem; line-height:1.65; }
  </style>
</head>
<body>
{% include nav.html %}
<main class="page-wrap">
{{ content }}
{% include footer.html %}
</main>
</body>
</html>
